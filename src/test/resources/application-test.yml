spring:
  datasource:
    url: jdbc:h2:mem:marketplace-test-${random.uuid};DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: user_test
    password: test-password
    driver-class-name: org.h2.Driver

  sql:
    init:
      mode: embedded
      schema-locations: classpath:db/init/schema.sql
      data-locations: classpath:db/test/products-test.sql

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  h2:
    console:
      enabled: false
