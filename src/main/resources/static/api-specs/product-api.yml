openapi: 3.1.0

info:
  title: Cosmo Cats Product API
  description: CRUD API for products in the Cosmo Cats intergalactic marketplace.
  version: 1.0.0

servers:
  - url: http://localhost:8081/marketplace/api/v1
    description: Local development server

tags:
  - name: Products
    description: Product catalogue operations

paths:
  /products:
    get:
      tags: [Products]
      summary: Get a page of products
      description: Returns a page of products sorted by price.
      operationId: getAllProducts
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/ProductSort'
      responses:
        '200':
          description: The requested product page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPageResponse'
              examples:
                firstPage:
                  $ref: '#/components/examples/ProductPage'
        '400':
          $ref: '#/components/responses/ValidationError'

    post:
      tags: [Products]
      summary: Create a product
      description: Creates a product and returns the persisted representation.
      operationId: createProduct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
            examples:
              createProduct:
                $ref: '#/components/examples/ProductRequest'
      responses:
        '201':
          description: Product created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
              examples:
                createdProduct:
                  $ref: '#/components/examples/Product'
        '400':
          $ref: '#/components/responses/ValidationError'

  /products/{id}:
    parameters:
      - $ref: '#/components/parameters/ProductId'

    get:
      tags: [Products]
      summary: Get a product by ID
      description: Returns one product with the requested identifier.
      operationId: getProductById
      responses:
        '200':
          description: Product found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
              examples:
                product:
                  $ref: '#/components/examples/Product'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/ProductNotFound'

    put:
      tags: [Products]
      summary: Update a product
      description: Replaces the editable fields of an existing product.
      operationId: updateProduct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProductRequest'
            examples:
              updateProduct:
                $ref: '#/components/examples/ProductRequest'
      responses:
        '200':
          description: Product updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
              examples:
                updatedProduct:
                  $ref: '#/components/examples/Product'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/ProductNotFound'

    delete:
      tags: [Products]
      summary: Delete a product
      description: Permanently deletes a product by its identifier.
      operationId: deleteProduct
      responses:
        '204':
          description: Product deleted successfully. The response has no body.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/ProductNotFound'

components:
  parameters:
    ProductId:
      name: id
      in: path
      required: true
      description: Product identifier.
      schema:
        type: string
        format: uuid
      example: 10000000-0000-4000-8000-000000000002

    Page:
      name: page
      in: query
      required: false
      description: Zero-based page index.
      schema:
        type: integer
        minimum: 0
        default: 0
      example: 0

    Size:
      name: size
      in: query
      required: false
      description: Number of products per page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      example: 20

    ProductSort:
      name: sort
      in: query
      required: false
      description: Product price sorting direction.
      schema:
        $ref: '#/components/schemas/ProductSort'

  responses:
    ValidationError:
      description: Request validation failed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblem'
          examples:
            invalidProduct:
              $ref: '#/components/examples/ValidationProblem'

    BadRequest:
      description: The request cannot be parsed or contains a value of an invalid type.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            invalidIdentifier:
              value:
                type: about:blank
                title: Bad Request
                status: 400
                detail: Method parameter 'id' could not be converted to UUID.
                instance: /marketplace/api/v1/products/not-a-uuid

    ProductNotFound:
      description: No product exists with the requested identifier.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            productNotFound:
              value:
                type: https://cosmo-cats.market/errors/not-found
                title: Not Found
                status: 404
                detail: Product 00000000-0000-0000-0000-000000000000 was not found.
                instance: /marketplace/api/v1/products/00000000-0000-0000-0000-000000000000

  schemas:
    ProductSort:
      type: string
      description: Direction in which products are sorted by price.
      enum: [PRICE_ASC, PRICE_DESC]
      default: PRICE_ASC
      example: PRICE_ASC

    CreateProductRequest:
      type: object
      additionalProperties: false
      required: [name, price, currency, stock, categoryId]
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 100
          description: Product name. It must contain star, galaxy, or comet as a separate word.
          example: Comet Catnip
        description:
          type: [string, 'null']
          maxLength: 500
          description: Optional product description.
          example: Freeze-dried catnip grown in nutrient-rich comet dust.
        price:
          type: number
          format: decimal
          exclusiveMinimum: 0
          multipleOf: 0.01
          description: Product price in the specified currency.
          example: 8.49
        currency:
          type: string
          minLength: 3
          maxLength: 3
          pattern: '^[A-Z]{3}$'
          description: ISO 4217 currency code.
          example: USD
        stock:
          type: integer
          minimum: 0
          description: Available product quantity.
          example: 85
        categoryId:
          type: string
          format: uuid
          description: Identifier of the product category.
          example: 20000000-0000-4000-8000-000000000001

    UpdateProductRequest:
      type: object
      additionalProperties: false
      required: [name, price, currency, stock, categoryId]
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 100
          description: Product name. It must contain star, galaxy, or comet as a separate word.
          example: Comet Catnip
        description:
          type: [string, 'null']
          maxLength: 500
          description: Optional product description.
          example: Freeze-dried catnip grown in nutrient-rich comet dust.
        price:
          type: number
          format: decimal
          exclusiveMinimum: 0
          multipleOf: 0.01
          description: Product price in the specified currency.
          example: 8.49
        currency:
          type: string
          minLength: 3
          maxLength: 3
          pattern: '^[A-Z]{3}$'
          description: ISO 4217 currency code.
          example: USD
        stock:
          type: integer
          format: int32
          minimum: 0
          description: Available product quantity.
          example: 85
        categoryId:
          type: string
          format: uuid
          description: Identifier of the product category.
          example: 20000000-0000-4000-8000-000000000001

    ProductResponse:
      type: object
      additionalProperties: false
      required: [id, name, description, price, currency, stock, categoryId]
      properties:
        id:
          type: string
          format: uuid
          description: Product identifier.
          example: 10000000-0000-4000-8000-000000000002
        name:
          type: string
          minLength: 3
          maxLength: 100
          description: Product name.
          example: Comet Catnip
        description:
          type: string
          maxLength: 500
          description: Product description. Empty when no description was supplied.
          example: Freeze-dried catnip grown in nutrient-rich comet dust.
        price:
          type: number
          format: decimal
          exclusiveMinimum: 0
          multipleOf: 0.01
          description: Product price.
          example: 8.49
        currency:
          type: string
          minLength: 3
          maxLength: 3
          pattern: '^[A-Z]{3}$'
          description: ISO 4217 currency code.
          example: USD
        stock:
          type: integer
          minimum: 0
          description: Available product quantity.
          example: 85
        categoryId:
          type: string
          format: uuid
          description: Identifier of the product category.
          example: 20000000-0000-4000-8000-000000000001

    ProductPageResponse:
      type: object
      additionalProperties: false
      required: [content, hasContent, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          description: Products on the current page.
          items:
            $ref: '#/components/schemas/ProductResponse'
        hasContent:
          type: boolean
          description: Whether the current page contains any products.
          example: true
        page:
          type: integer
          minimum: 0
          description: Current zero-based page index.
          example: 0
        size:
          type: integer
          minimum: 1
          maximum: 100
          description: Requested page size.
          example: 20
        totalElements:
          type: integer
          minimum: 0
          description: Total number of products.
          example: 12
        totalPages:
          type: integer
          minimum: 0
          description: Total number of pages.
          example: 1

    Problem:
      type: object
      description: Error response compliant with RFC 9457.
      additionalProperties: true
      required: [type, title, status, detail, instance]
      properties:
        type:
          type: string
          format: uri-reference
          description: URI identifying the problem type.
        title:
          type: string
          description: Short summary of the problem.
        status:
          type: integer
          description: HTTP status code.
        detail:
          type: string
          description: Human-readable explanation of the problem.
        instance:
          type: string
          format: uri-reference
          description: URI of the request that caused the problem.

    ValidationProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          additionalProperties: true
          required: [errors]
          properties:
            errors:
              type: array
              minItems: 1
              description: Individual request validation errors.
              items:
                $ref: '#/components/schemas/ApiError'

    ApiError:
      type: object
      additionalProperties: false
      required: [detail]
      properties:
        detail:
          type: string
          description: Description of the individual validation error.
          example: Product price must be greater than zero.
        pointer:
          type: string
          description: JSON Pointer-like path to the invalid field.
          example: /price

  examples:
    ProductRequest:
      summary: Valid product request
      value:
        name: Comet Catnip
        description: Freeze-dried catnip grown in nutrient-rich comet dust.
        price: 8.49
        currency: USD
        stock: 85
        categoryId: 20000000-0000-4000-8000-000000000001

    Product:
      summary: Product response
      value:
        id: 10000000-0000-4000-8000-000000000002
        name: Comet Catnip
        description: Freeze-dried catnip grown in nutrient-rich comet dust.
        price: 8.49
        currency: USD
        stock: 85
        categoryId: 20000000-0000-4000-8000-000000000001

    ProductPage:
      summary: First product page
      value:
        content:
          - id: 10000000-0000-4000-8000-000000000002
            name: Comet Catnip
            description: Freeze-dried catnip grown in nutrient-rich comet dust.
            price: 8.49
            currency: USD
            stock: 85
            categoryId: 20000000-0000-4000-8000-000000000001
        hasContent: true
        page: 0
        size: 20
        totalElements: 12
        totalPages: 1

    ValidationProblem:
      summary: Invalid product fields
      value:
        type: https://cosmo-cats.market/errors/validation-error
        title: Validation error
        status: 400
        detail: Validation failed for one or more fields. Please check your request parameters.
        instance: /marketplace/api/v1/products
        errors:
          - detail: Product price must be greater than zero.
            pointer: /price
