server:
  port: 8081

spring:
  config:
    import: "file:.env[.properties]"

  liquibase:
    change-log: classpath:db/changelog/db.changelog-local.yaml

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: true
    open-in-view: false

logging:
  level:
    space.cosmocats.marketplace: DEBUG

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    urls:
      - name: Products
        url: "${server.servlet.context-path:}/api-specs/product-api.yml"
      - name: Categories
        url: "${server.servlet.context-path:}/api-specs/category-api.yml"
      - name: Orders
        url: "${server.servlet.context-path:}/api-specs/order-api.yml"
      - name: Reports
        url: "${server.servlet.context-path:}/api-specs/report-api.yml"
    urls-primary-name: Products
    disable-swagger-default-url: true
