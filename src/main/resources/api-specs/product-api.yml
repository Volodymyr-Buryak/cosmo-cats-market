openapi: 3.1.0

info:
    title: Product API
    description: Product API for managing products in the system.
    version: 1.0.0

servers:
  - url: http://localhost:8081/api/v1
    description: Local Development Server

paths:
    /products:
      get:
        summary: Get all products
        tags:
          - Products
        operationId: getAllProducts

        parameters:
          - name: page
            in: query
            required: false
            description: Zero-based page index
            schema:
              type: integer
              minimum: 0
              default: 0

          - name: size
            in: query
            required: false
            description: Number of products per page
            schema:
              type: integer
              minimum: 1
              maximum: 100
              default: 20

          - name: sort
            in: query
            required: false
            description: Sort products by price in ascending or descending order
            schema:
              type: string
              enum:
                - PRICE_ASC
                - PRICE_DESC
              example: PRICE_ASC

        responses:
          '200':
            description: Products retrieved successfully
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ProductList'

          '400':
            description: Invalid query parameters
            content:
              application/problem+json:
                schema:
                  $ref: '#/components/schemas/ErrorResponse'

          default:
            description: Unexpected server error
            content:
              application/problem+json:
                schema:
                  $ref: '#/components/schemas/ErrorResponse'

      post:
        summary: Create a new product
        tags:
          - Products
        operationId: createProduct

        requestBody:
          required: true
          description: Product data for creation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'

        responses:
          '201':
            description: Product created successfully
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/Product'

          '400':
            description: Product validation failed
            content:
              application/problem+json:
                schema:
                  $ref: '#/components/schemas/ValidationError'

          default:
            description: Unexpected server error
            content:
              application/problem+json:
                schema:
                  $ref: '#/components/schemas/ErrorResponse'

    /products/{id}:
      get:
        summary: Get a product by ID
        tags:
          - Products
        operationId: getProductById

        parameters:
          - name: id
            in: path
            required: true
            description: Unique product identifier
            schema:
              type: string
              format: uuid
              example: "01a0e336-56ef-756a-8efd-4510b60f2921"

        responses:
          '200':
            description: Product found
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/Product'

          '400':
            description: Invalid product identifier
            content:
              application/problem+json:
                schema:
                  $ref: '#/components/schemas/ErrorResponse'

          '404':
            description: Product not found
            content:
              application/problem+json:
                schema:
                  $ref: '#/components/schemas/ErrorResponse'

          default:
            description: Unexpected server error
            content:
              application/problem+json:
                schema:
                  $ref: '#/components/schemas/ErrorResponse'

      put:
        summary: Update a product by ID
        tags:
          - Products
        operationId: updateProduct

        parameters:
          - name: id
            in: path
            required: true
            description: Unique product identifier
            schema:
              type: string
              format: uuid
              example: "01a0e336-56ef-756a-8efd-4510b60f2921"

        requestBody:
          required: true
          description: Updated product data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'

        responses:
          '200':
            description: Product updated successfully
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/Product'

          '400':
            description: Product validation failed
            content:
              application/problem+json:
                schema:
                  $ref: '#/components/schemas/ValidationError'

          '404':
            description: Product not found
            content:
              application/problem+json:
                schema:
                  $ref: '#/components/schemas/ErrorResponse'

          default:
            description: Unexpected server error
            content:
              application/problem+json:
                schema:
                  $ref: '#/components/schemas/ErrorResponse'

      delete:
        summary: Delete a product by ID
        tags:
          - Products
        operationId: deleteProduct

        parameters:
          - name: id
            in: path
            required: true
            description: Unique product identifier
            schema:
              type: string
              format: uuid
              example: "01a0e336-56ef-756a-8efd-4510b60f2921"

        responses:
          '204':
            description: Product deleted successfully

          '400':
            description: Invalid product identifier
            content:
              application/problem+json:
                schema:
                  $ref: '#/components/schemas/ErrorResponse'

          '404':
            description: Product not found
            content:
              application/problem+json:
                schema:
                  $ref: '#/components/schemas/ErrorResponse'

          default:
            description: Unexpected server error
            content:
              application/problem+json:
                schema:
                  $ref: '#/components/schemas/ErrorResponse'


components:
    schemas:
      Product:
        type: object
        required:
          - name
          - price
          - categoryId

        properties:
          id:
            type: string
            format: uuid
            readOnly: true
            description: Unique product identifier in UUIDv7 format
            example: "01a0e336-56ef-7141-ad13-2be88e663c76"

          name:
            type: string
            minLength: 3
            maxLength: 100
            description: Product name
            example: "Galaxy Milk"

          description:
            type: string
            maxLength: 500
            description: Product description
            example: "Milk produced in the Andromeda sector"

          price:
            type: number
            format: decimal
            minimum: 0.01
            multipleOf: 0.01
            description: Product price
            example: 19.99

          categoryId:
            type: string
            format: uuid
            description: Identifier of the product category
            example: "01a0e336-56ef-756a-8efd-4510b60f2921"

      ProductList:
        type: object
        required:
          - content
          - page
          - size
          - totalElements

        properties:
          content:
            type: array
            description: Products on the current page
            items:
              $ref: '#/components/schemas/Product'

          page:
            type: integer
            minimum: 0
            description: Current zero-based page index
            example: 0

          size:
            type: integer
            minimum: 1
            maximum: 100
            description: Number of products per page
            example: 20

          totalElements:
            type: integer
            format: int64
            minimum: 0
            description: Total number of products
            example: 42

      ValidationError:
        type: object
        required:
          - type
          - title
          - status
          - detail
          - instance
          - errors

        properties:
          type:
            type: string
            format: uri
            description: URI reference identifying the validation error type
            example: "https://cosmo-cats.market/errors/validation"

          title:
            type: string
            description: Short description of the error
            example: "Validation failed"

          status:
            type: integer
            description: HTTP status code
            example: 400

          detail:
            type: string
            description: Detailed description of the validation error
            example: "Request contains invalid parameters."

          instance:
            type: string
            description: URI of the request that caused the error
            example: "/api/v1/products"

          errors:
            type: array
            description: List of validation violations
            items:
              $ref: '#/components/schemas/FieldViolation'

      FieldViolation:
        type: object
        required:
          - fieldName
          - reason

        properties:
          fieldName:
            type: string
            description: Field where validation error occurred
            example: "price"

          reason:
            type: string
            description: Reason for the validation error
            example: "must be greater than or equal to 0.01"

      ErrorResponse:
        type: object
        required:
          - type
          - title
          - status
          - detail
          - instance

        properties:
          type:
            type: string
            format: uri
            description: URI reference identifying the error type
            example: "https://cosmo-cats.market/errors/internal"

          title:
            type: string
            description: Short description of the error
            example: "Internal server error"

          status:
            type: integer
            description: HTTP status code
            example: 500

          detail:
            type: string
            description: Detailed description of the error
            example: "An unexpected error occurred."

          instance:
            type: string
            description: URI of the request that caused the error
            example: "/api/v1/products"
