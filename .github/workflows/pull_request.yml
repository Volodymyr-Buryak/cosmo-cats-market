name: Build and Test Coverage
on:
  pull_request:
    branches:
      - '**' # Execute on all branches

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout # Downloads the source code from the repository to the virtual machine.
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: 'oracle'
          java-version: '25'

      - name: Check Java version
        run: java --version

      # Cache Gradle dependencies
      - name: Cache Gradle dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle.properties', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for Gradlew
        run: chmod +x ./gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: external
          add-job-summary: never

      - name: Build and Test
        run: ./gradlew build jacocoTestReport

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: test-coverage-report
          path: build/reports/coverage/index.html
          if-no-files-found: error

